name: ci
on: [push, pull_request]

jobs:
  backend-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python Dependencies & Audit Tools
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pip-audit mypy
      - name: Static Formatting Check with Ruff
        run: ruff format --check backend
      - name: Static Linting with Ruff
        run: ruff check backend
      - name: Strict Type Checking with Mypy
        run: mypy backend
      - name: Pytest with Branch Coverage (>=95%)
        run: pytest --cov=app --cov-branch --cov-fail-under=95
      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit -r requirements.txt

  frontend-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Frontend Test Tools
        run: npm ci || npm install
      - name: Run Vitest Suite (Logic, i18n, API, WCAG Contrast)
        run: npm test
      - name: Frontend Dependency Audit
        run: npm audit --audit-level=high
