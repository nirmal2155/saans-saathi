<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaansSaathi — Urban Air Quality Assistant</title>
<meta name="description" content="AI-assisted urban air quality companion for families navigating severe winter smog. Low-emission routines, indoor air hacks, and actionable alternatives.">
<meta name="theme-color" content="#0b6b50">
<style>
/* ─── WCAG 2.2 AA Compliant Theme & Tokens ─────────────────────── */
:root {
  --bg: #f5f8f6;
  --card-bg: #ffffff;
  --ink: #111e17;
  --ink-mut: #3a4d43;
  --border: #ccd8d1;
  --primary: #0b6b50;
  --primary-contrast: #ffffff;
  --focus-ring: #0b6b50;
  --danger: #b71c1c;
  --danger-contrast: #ffffff;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.05);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1511;
    --card-bg: #14211a;
    --ink: #e6f0eb;
    --ink-mut: #96aca0;
    --border: #24382e;
    --primary: #38b284;
    --primary-contrast: #061c14;
    --focus-ring: #4fd1a5;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
}

:root[data-theme="dark"] {
  --bg: #0c1511;
  --card-bg: #14211a;
  --ink: #e6f0eb;
  --ink-mut: #96aca0;
  --border: #24382e;
  --primary: #38b284;
  --primary-contrast: #061c14;
  --focus-ring: #4fd1a5;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

/* ─── Reset & Base ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0); }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  padding-top: env(safe-area-inset-top, 0);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

/* ─── Skip Link (Accessibility) ───────────────────────────────── */
.skip-link {
  position: absolute;
  top: -100px;
  left: 12px;
  background: var(--primary);
  color: var(--primary-contrast);
  padding: 10px 18px;
  font-weight: 700;
  border-radius: 0 0 8px 8px;
  text-decoration: none;
  z-index: 9999;
  transition: top 0.2s ease;
}
.skip-link:focus {
  top: 0;
}

/* ─── Layout Shell ────────────────────────────────────────────── */
.app-shell {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── Header ──────────────────────────────────────────────────── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
}
.brand-title {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand-tagline {
  margin: 4px 0 0;
  font-size: 0.92rem;
  color: var(--ink-mut);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── Controls & Buttons (WCAG >= 44px touch targets) ────────── */
button, input, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background-color: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--ink);
  border-radius: 10px;
  padding: 8px 14px;
  min-height: 44px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover {
  background-color: var(--border);
}
button.btn-primary {
  background-color: var(--primary);
  color: var(--primary-contrast);
  border-color: var(--primary);
}
button.btn-primary:hover {
  opacity: 0.92;
}
button.btn-danger {
  background-color: transparent;
  color: var(--danger);
  border-color: var(--border);
}
button.btn-danger:hover {
  background-color: var(--danger);
  color: var(--danger-contrast);
}
button.btn-sm {
  min-height: 38px;
  padding: 4px 10px;
  font-size: 0.88rem;
}

/* ─── Visible Focus Ring (WCAG 2.2 AA) ────────────────────────── */
:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ─── Form Inputs ─────────────────────────────────────────────── */
.form-group {
  margin-bottom: 8px;
}
label {
  display: block;
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 4px;
}
input[type="text"],
input[type="search"],
input[type="number"],
select {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background-color: var(--bg);
  color: var(--ink);
}
input[type="range"] {
  width: 100%;
  margin: 10px 0;
  accent-color: var(--primary);
}
.chk-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-weight: normal;
  margin: 6px 0;
}
.chk-label input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
}

/* ─── Grid & Rows ─────────────────────────────────────────────── */
.row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}
.loc-controls-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  margin-top: 8px;
}
@media (max-width: 580px) {
  .loc-controls-row {
    grid-template-columns: 1fr;
  }
}

/* ─── Cards ───────────────────────────────────────────────────── */
.card {
  background-color: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--card-shadow);
}
.big-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

/* ─── AQI Hero Display ────────────────────────────────────────── */
.aqi-num-hero {
  font-size: 3rem;
  font-weight: 900;
  line-height: 1;
  padding: 16px 20px;
  border-radius: 14px;
  min-width: 105px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.aqi-hero-meta {
  flex: 1;
  min-width: 200px;
}
.aqi-hero-title {
  margin: 0;
  font-size: 1.25rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.health-msg {
  margin: 6px 0 4px;
  font-size: 0.95rem;
  color: var(--ink-mut);
}
.pm-reading {
  margin: 4px 0 0;
  font-size: 0.9rem;
}
.pill {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.85rem;
  line-height: 1.3;
}
.model-tag {
  margin-top: 10px;
  margin-bottom: 0;
  font-style: italic;
}

/* ─── Preset Buttons & Sliders ────────────────────────────────── */
.preset-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.slider-val {
  color: var(--primary);
  font-weight: 800;
}

/* ─── Tablist Navigation ──────────────────────────────────────── */
.tabs-wrap {
  display: flex;
  gap: 6px;
  margin: 12px 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-btn {
  flex: 1 0 auto;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  padding: 10px 14px;
  font-weight: 700;
  transition: background 0.15s ease;
}
.tab-btn.active {
  background: var(--primary);
  color: var(--primary-contrast);
  border-color: var(--primary);
}

/* ─── Lists & Details ─────────────────────────────────────────── */
.routine-list, .action-list {
  padding-left: 20px;
  margin: 8px 0;
}
.routine-list li, .action-list li {
  margin-bottom: 10px;
}
.why-details {
  margin-top: 4px;
  padding: 4px 8px;
  border-left: 2px solid var(--border);
}
.why-details summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--primary);
}
.why-text {
  margin: 4px 0 0;
  font-size: 0.88rem;
  color: var(--ink-mut);
}

/* ─── Question Row (GenAI) ────────────────────────────────────── */
.question-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.question-row input {
  flex: 1;
}

/* ─── Family Cards ────────────────────────────────────────────── */
.member-card {
  border-left: 4px solid var(--primary);
}
.member-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.member-card-header h3 {
  margin: 0;
  font-size: 1.05rem;
}
.member-checks {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.add-member-btn {
  margin-top: 8px;
  width: 100%;
}
.rec-card {
  border-left: 4px solid var(--border);
  margin-top: 10px;
}
.rec-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.rec-header h4 {
  margin: 0;
  font-size: 1.05rem;
}

/* ─── Indoor & Impact Outputs ─────────────────────────────────── */
.cadr-stat {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--primary);
  margin: 6px 0;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 1.05rem;
}
.savings-row {
  color: #1b5e20;
  font-weight: 700;
}
:root[data-theme="dark"] .savings-row {
  color: #4fd1a5;
}
.stat-num {
  font-weight: 800;
}

/* ─── Status, Errors & Notes ──────────────────────────────────── */
.loading-text {
  color: var(--ink-mut);
  font-style: italic;
}
.error-text {
  color: var(--danger);
  font-weight: 600;
}
.note {
  font-size: 0.85rem;
  color: var(--ink-mut);
  line-height: 1.4;
}

/* ─── Footer ──────────────────────────────────────────────────── */
.app-footer {
  margin-top: auto;
  padding-top: 20px;
  text-align: center;
}

/* ─── Reduced Motion Support (WCAG 2.2 AA) ────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ─── Viewport Responsiveness (down to 360px) ─────────────────── */
@media (max-width: 480px) {
  .app-shell {
    padding: 10px;
  }
  .card {
    padding: 12px;
  }
  .aqi-num-hero {
    font-size: 2.2rem;
    min-width: 80px;
    padding: 10px 14px;
  }
  .brand-title {
    font-size: 1.25rem;
  }
}
</style>
</head>
<body>
<a class="skip-link" href="#main-tabpanel">Skip to main content</a>

<div class="app-shell">
  <header class="app-header">
    <div>
      <h1 class="brand-title" id="app-title">SaansSaathi</h1>
      <p class="brand-tagline" id="app-tagline">Family Smog Guardian</p>
    </div>
    <div class="header-actions">
      <button id="theme-toggle-btn" type="button" aria-label="Toggle dark mode">🌙</button>
      <button id="lang-toggle-btn" type="button" aria-label="Switch language">हिन्दी</button>
    </div>
  </header>

  <!-- Location Search & Status Mount -->
  <div id="location-mount"></div>

  <!-- Accessible Tab Navigation Bar -->
  <nav aria-label="Main Navigation">
    <div role="tablist" class="tabs-wrap" id="main-tablist" aria-label="Application Sections"></div>
  </nav>

  <!-- Main Accessible Content Panel -->
  <main id="main-tabpanel" role="tabpanel" tabindex="-1"></main>

  <!-- Grounded Medical Disclaimer -->
  <footer class="app-footer">
    <p class="note" id="disclaimer-text"></p>
  </footer>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
